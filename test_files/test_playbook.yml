---
- name: Deploy web application
  hosts: all
  become: true

  tasks:
    - name: Install nginx
      apt:
        name: nginx
        state: present

    - name: Copy config
      shell: cp /tmp/config /etc/app/config

    - name: Set database password
      lineinfile:
        path: /etc/app/config
        line: "password: mysecretpass123"

    - name: Start service
      command: systemctl start myapp
      no_log: false
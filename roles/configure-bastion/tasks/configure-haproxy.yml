---
- name: Install HAProxy
  dnf:
    name: haproxy
    state: present

- name: Backup original HAProxy config
  copy:
    src: /etc/haproxy/haproxy.cfg
    dest: /etc/haproxy/haproxy.cfg.backup
    remote_src: yes
    force: no

- name: Allow HAProxy to bind to OKD ports (SELinux)
  ansible.builtin.command: setsebool -P haproxy_connect_any 1
  become: true

- name: Allow port 6443 for HAProxy (SELinux)
  ansible.builtin.command: semanage port -a -t http_port_t -p tcp 6443
  become: true
  ignore_errors: true

- name: Allow port 22623 for HAProxy (SELinux)
  ansible.builtin.command: semanage port -a -t http_port_t -p tcp 22623
  become: true
  ignore_errors: true

- name: Deploy HAProxy configuration
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: '0644'
    validate: 'haproxy -f %s -c'
  notify: restart haproxy

- name: Enable and start HAProxy
  systemd:
    name: haproxy
    state: started
    enabled: yes

- name: Flush handlers to restart haproxy
  meta: flush_handlers

- name: Verify HAProxy is listening on required ports
  wait_for:
    port: "{{ item }}"
    timeout: 10
  loop:
    - 6443
    - 22623
    - 80
    - 443

---
- name: Display VM creation banner
  hosts: host
  gather_facts: false
  vars_files:
    - vars/main.yml
  tasks:
    - name: Show banner
      debug:
        msg: |
          ================================
          Creating OKD VMs
          ================================
          Bastion:   {{ bastion_ip }} ({{ bastion_mac }})
          Bootstrap: {{ bootstrap_ip }} ({{ bootstrap_mac }})
          OKD Node:  {{ okd_node_ip }} ({{ okd_node_mac }})
          ================================

- name: Create OKD Virtual Machines
  hosts: host
  become: false
  gather_facts: yes
  vars_files:
    - vars/main.yml
  roles:
    - create-bastion

- name: Configure Bastion VM
  hosts: bastion
  become: true
  gather_facts: yes
  vars_files:
    - vars/main.yml
  roles:
    - configure-bastion

- name: Download OKD Tools on Host
  hosts: host
  become: true
  gather_facts: yes
  vars_files:
    - vars/main.yml
  roles:
    - download-okd-tools

- name: Generate Ignition Files
  hosts: host
  become: false
  gather_facts: yes
  vars_files:
    - vars/main.yml
  roles:
    - generate-ignition

- name: Configure DNS for OKD cluster
  hosts: host
  become: true
  gather_facts: false
  vars_files:
    - vars/main.yml
  tasks:
    - name: Write libvirt DNS entries for OKD
      copy:
        dest: /var/lib/libvirt/dnsmasq/okd-net.addnhosts
        content: |
          {{ bootstrap_ip }} api-int.{{ okd_cluster_name }}.{{ okd_domain }}
          {{ okd_node_ip }} api.{{ okd_cluster_name }}.{{ okd_domain }}
          {{ okd_node_ip }} console-openshift-console.apps.{{ okd_cluster_name }}.{{ okd_domain }}
          {{ okd_node_ip }} oauth-openshift.apps.{{ okd_cluster_name }}.{{ okd_domain }}
          {{ bastion_ip }} bastion.{{ okd_domain }}
        owner: root
        group: root
        mode: '0644'

    - name: Restart okd-net to apply DNS
      shell: virsh net-destroy okd-net && virsh net-start okd-net

- name: Create Bootstrap and OKD Node VMs
  hosts: host
  become: false
  gather_facts: yes
  vars_files:
    - vars/main.yml
  roles:
    - create-bootstrap
    - create-okd-node

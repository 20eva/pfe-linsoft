[localhost]
127.0.0.1 ansible_connection=local

[host]
okd-host ansible_host=192.168.1.4 ansible_user=root ansible_connection=ssh ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[bastion]
bastion-vm ansible_host=192.168.100.10 ansible_user=root ansible_become=yes ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[okd_nodes]
okd-node ansible_host=192.168.100.50 ansible_user=core ansible_become=yes

[all:vars]
okd_domain=okd.local
okd_cluster_name=sno
bastion_ip=192.168.100.10
okd_node_ip=192.168.100.50
network_cidr=192.168.100.0/24

metadata:
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: |
      {"apiVersion":"tekton.dev/v1","kind":"Pipeline","metadata":{"annotations":{},"creationTimestamp":"2026-07-29T08:28:15Z","generation":67,"name":"blog-api-pipeline","namespace":"blog-app","resourceVersion":"27203997","uid":"c86d68bb-86ad-4c8e-a568-22c3ffc47e3b"},"spec":{"finally":[{"name":"notify-pipeline-status","params":[{"name":"pipelinerun-name","value":"$(context.pipelineRun.name)"},{"name":"clone-status","value":"$(tasks.clone.status)"},{"name":"build-status","value":"$(tasks.build.status)"},{"name":"sonarqube-scan-status","value":"$(tasks.sonarqube-scan.status)"},{"name":"quality-gate-status","value":"$(tasks.quality-gate.status)"},{"name":"docker-build-status","value":"$(tasks.docker-build.status)"},{"name":"trivy-scan-status","value":"$(tasks.trivy-scan.status)"},{"name":"cosign-sign-status","value":"$(tasks.cosign-sign.status)"},{"name":"deploy-status","value":"$(tasks.deploy.status)"},{"name":"detection-status","value":"$(tasks.detection-recommendation.status)"}],"taskSpec":{"metadata":{},"params":[{"name":"pipelinerun-name","type":"string"},{"name":"clone-status","type":"string"},{"name":"build-status","type":"string"},{"name":"sonarqube-scan-status","type":"string"},{"name":"quality-gate-status","type":"string"},{"name":"docker-build-status","type":"string"},{"name":"trivy-scan-status","type":"string"},{"name":"cosign-sign-status","type":"string"},{"name":"deploy-status","type":"string"},{"default":"Unknown","name":"detection-status","type":"string"}],"spec":null,"steps":[{"computeResources":{},"env":[{"name":"PIPELINERUN_NAME","value":"$(params.pipelinerun-name)"},{"name":"CLONE_STATUS","value":"$(params.clone-status)"},{"name":"BUILD_STATUS","value":"$(params.build-status)"},{"name":"SONAR_STATUS","value":"$(params.sonarqube-scan-status)"},{"name":"QUALITY_STATUS","value":"$(params.quality-gate-status)"},{"name":"DOCKER_STATUS","value":"$(params.docker-build-status)"},{"name":"TRIVY_STATUS","value":"$(params.trivy-scan-status)"},{"name":"COSIGN_STATUS","value":"$(params.cosign-sign-status)"},{"name":"DEPLOY_STATUS","value":"$(params.deploy-status)"},{"name":"DETECTION_STATUS","value":"$(params.detection-status)"}],"image":"python:3.11-slim","name":"send-notification","script":"#!/usr/bin/env python3\n\nimport smtplib\n\nimport os\n\nimport subprocess\n\nimport urllib.request\n\nfrom email.mime.multipart import MIMEMultipart\n\nfrom email.mime.text import MIMEText\n\nfrom email.mime.base import MIMEBase\n\nfrom email import encoders\n\nfrom datetime import datetime\n\n\n\n# Install reportlab for PDF\n\nsubprocess.run(['pip', 'install', 'reportlab', '-q'], capture_output=True)\n\n\n\nfrom reportlab.lib.pagesizes import A4\n\nfrom reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle\n\nfrom reportlab.lib.units import cm\n\nfrom reportlab.lib import colors\n\nfrom reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle, HRFlowable\n\nfrom reportlab.lib.enums import TA_LEFT, TA_CENTER\n\n\n\npipelinerun = os.environ.get('PIPELINERUN_NAME', 'unknown')\n\nstages = [\n\n    ('Clone',                        os.environ.get('CLONE_STATUS', 'Unknown')),\n\n    ('Detection \u0026 Recommendation',   os.environ.get('DETECTION_STATUS', 'Unknown')),\n\n    ('Build',                        os.environ.get('BUILD_STATUS', 'Unknown')),\n\n    ('SonarQube',                    os.environ.get('SONAR_STATUS', 'Unknown')),\n\n    ('Quality Gate',                 os.environ.get('QUALITY_STATUS', 'Unknown')),\n\n    ('Docker Build',                 os.environ.get('DOCKER_STATUS', 'Unknown')),\n\n    ('Trivy Scan',                   os.environ.get('TRIVY_STATUS', 'Unknown')),\n\n    ('Cosign Sign',                  os.environ.get('COSIGN_STATUS', 'Unknown')),\n\n    ('Deploy',                       os.environ.get('DEPLOY_STATUS', 'Unknown')),\n\n]\n\n\n\noverall_success = all(s in ['Succeeded', 'Unknown', 'Skipped'] for _, s in stages)\n\nfailed_stage = next(((n, s) for n, s in stages if s == 'Failed'), None)\n\ndetection_failed = os.environ.get('DETECTION_STATUS', 'Unknown') == 'Failed'\n\nconsole_url = f'https://console-openshift-console.apps.sno.okd.local/k8s/ns/blog-app/tekton.dev~v1~PipelineRun/{pipelinerun}'\n\napp_url = 'http://blog-api-blog-app.apps.sno.okd.local/'\n\ntimestamp = datetime.now().strftime('%Y-%m-%d %H:%M:%S')\n\n\n\n# Check app status\n\napp_status = 'Unknown'\n\ntry:\n\n    req = urllib.request.urlopen(app_url, timeout=5)\n\n    app_status = 'Online' if req.status == 200 else 'Degraded'\n\nexcept:\n\n    app_status = 'Unreachable'\n\n\n\n# Read scan results from JSON file\n\nimport os\n\nimport json as _json\n\n\n\nscan_results = ''\n\nissues_count = 0\n\nfindings = []\n\n\n\nprint('Workspace path: /workspace/source')\n\nprint('Files:', os.listdir('/workspace/source') if os.path.exists('/workspace/source') else 'NOT FOUND')\n\n\n\ntry:\n\n    with open('/workspace/source/scan-results.json', 'r') as f:\n\n        scan_data = _json.load(f)\n\n    issues_count = scan_data.get('issues_count', 0)\n\n    findings = scan_data.get('findings', [])\n\n    scan_results = scan_data.get('raw_output', '')\n\n    print(f'Loaded {len(findings)} findings from JSON')\n\nexcept Exception as e:\n\n    print(f'JSON read failed: {e}')\n\n    try:\n\n        with open('/workspace/source/scan-results.txt', 'r') as f:\n\n            scan_results = f.read()\n\n        print('Using txt fallback')\n\n    except Exception as e2:\n\n        print(f'TXT read failed: {e2}')\n\n        scan_results = 'No scan results available'\n\n\n\n\n\n# ── GENERATE PDF ──────────────────────────────────────────────────────────────\n\npdf_path = '/tmp/security-report.pdf'\n\n\n\ntry:\n\n    doc = SimpleDocTemplate(\n\n        pdf_path,\n\n        pagesize=A4,\n\n        rightMargin=2*cm,\n\n        leftMargin=2*cm,\n\n        topMargin=2*cm,\n\n        bottomMargin=2*cm\n\n    )\n\n\n\n    styles = getSampleStyleSheet()\n\n    story = []\n\n\n\n    # Colors\n\n    BLUE    = colors.HexColor('#0066cc')\n\n    RED     = colors.HexColor('#c9190b')\n\n    GREEN   = colors.HexColor('#3e8635')\n\n    ORANGE  = colors.HexColor('#f5a623')\n\n    GRAY    = colors.HexColor('#6a6e73')\n\n    LIGHT   = colors.HexColor('#f5f5f5')\n\n\n\n    # Styles\n\n    title_style = ParagraphStyle('title',\n\n        fontSize=20, fontName='Helvetica-Bold',\n\n        textColor=BLUE, spaceAfter=4, alignment=TA_CENTER)\n\n\n\n    sub_style = ParagraphStyle('sub',\n\n        fontSize=11, fontName='Helvetica',\n\n        textColor=GRAY, spaceAfter=2, alignment=TA_CENTER)\n\n\n\n    section_style = ParagraphStyle('section',\n\n        fontSize=13, fontName='Helvetica-Bold',\n\n        textColor=BLUE, spaceBefore=14, spaceAfter=6)\n\n\n\n    body_style = ParagraphStyle('body',\n\n        fontSize=10, fontName='Helvetica',\n\n        textColor=colors.black, spaceAfter=4)\n\n\n\n    code_style = ParagraphStyle('code',\n\n        fontSize=9, fontName='Courier',\n\n        textColor=colors.HexColor('#333333'),\n\n        backColor=colors.HexColor('#f5f5f5'),\n\n        spaceAfter=4, leftIndent=10)\n\n\n\n    rec_style = ParagraphStyle('rec',\n\n        fontSize=9, fontName='Helvetica-Oblique',\n\n        textColor=colors.HexColor('#3c3c3c'),\n\n        leftIndent=10, spaceAfter=6)\n\n\n\n    # Header\n\n    story.append(Paragraph('Detection \u0026 Recommendation Model', title_style))\n\n    story.append(Paragraph('Security Report — Ansible Playbooks', sub_style))\n\n    story.append(Spacer(1, 0.3*cm))\n\n    story.append(HRFlowable(width='100%', thickness=2, color=BLUE))\n\n    story.append(Spacer(1, 0.3*cm))\n\n\n\n    # Meta info table\n\n    status_color = GREEN if overall_success else RED\n\n    status_text  = 'PASSED' if overall_success else f'BLOCKED — {issues_count} issue(s) found'\n\n\n\n    meta = [\n\n        ['Pipeline Run', pipelinerun],\n\n        ['Date',         timestamp],\n\n        ['Status',       status_text],\n\n        ['Total Issues', str(issues_count)],\n\n    ]\n\n    meta_table = Table(meta, colWidths=[4*cm, 13*cm])\n\n    meta_table.setStyle(TableStyle([\n\n        ('FONTNAME',  (0,0), (0,-1), 'Helvetica-Bold'),\n\n        ('FONTNAME',  (1,0), (1,-1), 'Helvetica'),\n\n        ('FONTSIZE',  (0,0), (-1,-1), 10),\n\n        ('TEXTCOLOR', (0,0), (0,-1), GRAY),\n\n        ('TEXTCOLOR', (1,2), (1,2),  status_color),\n\n        ('FONTNAME',  (1,2), (1,2),  'Helvetica-Bold'),\n\n        ('ROWBACKGROUNDS', (0,0), (-1,-1), [colors.white, LIGHT]),\n\n        ('TOPPADDING',    (0,0), (-1,-1), 5),\n\n        ('BOTTOMPADDING', (0,0), (-1,-1), 5),\n\n        ('LEFTPADDING',   (0,0), (-1,-1), 8),\n\n    ]))\n\n    story.append(meta_table)\n\n    story.append(Spacer(1, 0.4*cm))\n\n\n\n    # Pipeline stages table\n\n    story.append(Paragraph('Pipeline Stage Results', section_style))\n\n    stage_data = [['Stage', 'Status']]\n\n    for name, status in stages:\n\n        stage_data.append([name, status])\n\n\n\n    stage_table = Table(stage_data, colWidths=[9*cm, 8*cm])\n\n    stage_styles = [\n\n        ('FONTNAME',     (0,0), (-1,0),  'Helvetica-Bold'),\n\n        ('FONTSIZE',     (0,0), (-1,-1), 10),\n\n        ('BACKGROUND',   (0,0), (-1,0),  LIGHT),\n\n        ('TEXTCOLOR',    (0,0), (-1,0),  GRAY),\n\n        ('TOPPADDING',   (0,0), (-1,-1), 6),\n\n        ('BOTTOMPADDING',(0,0), (-1,-1), 6),\n\n        ('LEFTPADDING',  (0,0), (-1,-1), 8),\n\n        ('GRID',         (0,0), (-1,-1), 0.5, colors.HexColor('#e0e0e0')),\n\n    ]\n\n    for i, (name, status) in enumerate(stages, 1):\n\n        c = GREEN if status == 'Succeeded' else RED if status == 'Failed' else GRAY\n\n        stage_styles.append(('TEXTCOLOR', (1,i), (1,i), c))\n\n        stage_styles.append(('FONTNAME',  (1,i), (1,i), 'Helvetica-Bold'))\n\n\n\n    stage_table.setStyle(TableStyle(stage_styles))\n\n    story.append(stage_table)\n\n    story.append(Spacer(1, 0.4*cm))\n\n\n\n    # Findings\n\n    if findings:\n\n        story.append(HRFlowable(width='100%', thickness=1, color=RED))\n\n        story.append(Paragraph(f'Security Findings — {len(findings)} Issue(s) Detected', section_style))\n\n\n\n        for i, f in enumerate(findings, 1):\n\n            conf = int(f['confidence'])\n\n            badge = RED if conf \u003e= 90 else ORANGE if conf \u003e= 80 else GRAY\n\n            bg    = colors.HexColor('#fff5f5') if conf \u003e= 90 else colors.HexColor('#fffbf0') if conf \u003e= 80 else colors.white\n\n\n\n            # Issue header\n\n            issue_header = Table(\n\n                [[f'Issue #{i}', f'{f[\"confidence\"]}% confidence']],\n\n                colWidths=[14*cm, 3*cm]\n\n            )\n\n            issue_header.setStyle(TableStyle([\n\n                ('BACKGROUND',   (0,0), (-1,-1), bg),\n\n                ('FONTNAME',     (0,0), (0,0),   'Helvetica-Bold'),\n\n                ('FONTNAME',     (1,0), (1,0),   'Helvetica-Bold'),\n\n                ('FONTSIZE',     (0,0), (-1,-1), 10),\n\n                ('TEXTCOLOR',    (1,0), (1,0),   badge),\n\n                ('TOPPADDING',   (0,0), (-1,-1), 6),\n\n                ('BOTTOMPADDING',(0,0), (-1,-1), 6),\n\n                ('LEFTPADDING',  (0,0), (-1,-1), 8),\n\n                ('LINEBELOW',    (0,0), (-1,-1), 1, badge),\n\n            ]))\n\n            story.append(issue_header)\n\n\n\n            # Issue details\n\n            details = [\n\n                ['File', f['file']],\n\n                ['Type', f['type']],\n\n            ]\n\n            detail_table = Table(details, colWidths=[3*cm, 14*cm])\n\n            detail_table.setStyle(TableStyle([\n\n                ('FONTNAME',     (0,0), (0,-1), 'Helvetica-Bold'),\n\n                ('FONTNAME',     (1,0), (1,-1), 'Helvetica'),\n\n                ('FONTSIZE',     (0,0), (-1,-1), 9),\n\n                ('TEXTCOLOR',    (0,0), (0,-1), GRAY),\n\n                ('TOPPADDING',   (0,0), (-1,-1), 4),\n\n                ('BOTTOMPADDING',(0,0), (-1,-1), 4),\n\n                ('LEFTPADDING',  (0,0), (-1,-1), 8),\n\n                ('BACKGROUND',   (0,0), (-1,-1), colors.white),\n\n            ]))\n\n            story.append(detail_table)\n\n\n\n            # Code line\n\n            story.append(Paragraph(f'\u003cb\u003eCode:\u003c/b\u003e', body_style))\n\n            story.append(Paragraph(f['line'][:120], code_style))\n\n\n\n            # Recommendation\n\n            story.append(Paragraph(f'\u003cb\u003eRecommendation:\u003c/b\u003e', body_style))\n\n            story.append(Paragraph(f['recommendation'], rec_style))\n\n            story.append(Spacer(1, 0.2*cm))\n\n\n\n        # Summary\n\n        story.append(HRFlowable(width='100%', thickness=1, color=RED))\n\n        story.append(Spacer(1, 0.3*cm))\n\n        story.append(Paragraph(\n\n            f'Total: {issues_count} issue(s) found. Fix all issues above and push again to unblock the pipeline.',\n\n            ParagraphStyle('summary', fontSize=10, fontName='Helvetica-Bold',\n\n                          textColor=RED, alignment=TA_CENTER)\n\n        ))\n\n    else:\n\n        story.append(Paragraph('No security issues detected above the confidence threshold.', body_style))\n\n\n\n    # Footer\n\n    story.append(Spacer(1, 0.5*cm))\n\n    story.append(HRFlowable(width='100%', thickness=1, color=LIGHT))\n\n    story.append(Paragraph(\n\n        'Linsoft DevSecOps Platform • OpenShift OKD 4.20 SNO • Detection \u0026 Recommendation Model',\n\n        ParagraphStyle('footer', fontSize=8, textColor=GRAY, alignment=TA_CENTER)\n\n    ))\n\n\n\n    doc.build(story)\n\n    print(f'PDF report generated: {pdf_path}')\n\n    pdf_generated = True\n\n\n\nexcept Exception as e:\n\n    print(f'PDF generation error: {e}')\n\n    pdf_generated = False\n\n\n\n# ── HTML EMAIL ────────────────────────────────────────────────────────────────\n\ndef icon(s): return '\u0026#10003;' if s=='Succeeded' else ('\u0026#10007;' if s=='Failed' else '\u0026#8226;')\n\ndef color(s): return '#3e8635' if s=='Succeeded' else ('#c9190b' if s=='Failed' else '#6a6e73')\n\n\n\nstages_rows = ''.join(\n\n    f'\u003ctr\u003e\u003ctd style=\"padding:6px 12px;font-size:13px;color:#151515;border-bottom:1px solid #f5f5f5\"\u003e{n}\u003c/td\u003e'\n\n    f'\u003ctd style=\"padding:6px 12px;font-weight:700;color:{color(s)};border-bottom:1px solid #f5f5f5\"\u003e{icon(s)} {s}\u003c/td\u003e\u003c/tr\u003e'\n\n    for n, s in stages\n\n)\n\n\n\nfindings_summary = ''\n\nif findings and detection_failed:\n\n    rows = ''\n\n    for i, f in enumerate(findings[:5], 1):\n\n        conf = int(f['confidence'])\n\n        badge_color = '#c9190b' if conf \u003e= 90 else '#f5a623' if conf \u003e= 80 else '#6a6e73'\n\n        rows += f'''\n\n        \u003ctr\u003e\n\n          \u003ctd style=\"padding:6px 10px;font-size:12px;font-weight:700;color:{badge_color}\"\u003e{f[\"confidence\"]}%\u003c/td\u003e\n\n          \u003ctd style=\"padding:6px 10px;font-size:11px;font-family:monospace;color:#151515\"\u003e{f[\"file\"]}\u003c/td\u003e\n\n          \u003ctd style=\"padding:6px 10px;font-size:11px;color:#6a6e73\"\u003e{f[\"type\"]}\u003c/td\u003e\n\n        \u003c/tr\u003e'''\n\n\n\n    more = f'\u003cp style=\"font-size:12px;color:#6a6e73;margin:8px 0 0\"\u003e...and {len(findings)-5} more issues in the attached PDF report.\u003c/p\u003e' if len(findings) \u003e 5 else ''\n\n\n\n    findings_summary = f'''\n\n    \u003cp style=\"font-size:12px;font-weight:700;color:#6a6e73;text-transform:uppercase;margin:20px 0 8px\"\u003e\n\n      Top Findings (see PDF for all {len(findings)})\n\n    \u003c/p\u003e\n\n    \u003ctable style=\"width:100%;border-collapse:collapse;border:1px solid #e0e0e0;margin-bottom:8px\"\u003e\n\n      \u003ctr style=\"background:#f5f5f5\"\u003e\n\n        \u003cth style=\"padding:6px 10px;text-align:left;font-size:11px;color:#6a6e73;width:80px\"\u003eConfidence\u003c/th\u003e\n\n        \u003cth style=\"padding:6px 10px;text-align:left;font-size:11px;color:#6a6e73\"\u003eFile:Line\u003c/th\u003e\n\n        \u003cth style=\"padding:6px 10px;text-align:left;font-size:11px;color:#6a6e73\"\u003eType\u003c/th\u003e\n\n      \u003c/tr\u003e\n\n      {rows}\n\n    \u003c/table\u003e\n\n    {more}\n\n    \u003cp style=\"font-size:12px;color:#6a6e73;margin:12px 0 0\"\u003e\n\n      \u0026#128196; \u003cb\u003eSee attached PDF\u003c/b\u003e for all findings with complete recommendations.\n\n    \u003c/p\u003e'''\n\n\n\nif overall_success:\n\n    bar = '#3e8635'\n\n    flag = '\u0026#10003; PIPELINE SUCCEEDED - APPLICATION DEPLOYED'\n\n    subject = f'[DEPLOYED] {pipelinerun} | Linsoft DevSecOps'\n\n    main_box = f'''\n\n    \u003cdiv style=\"background:#f0fff0;border:1px solid #3e8635;border-radius:6px;padding:16px;margin:20px 0\"\u003e\n\n      \u003cp style=\"color:#3e8635;font-weight:700;margin:0 0 8px\"\u003e\u0026#127881; All security gates passed\u003c/p\u003e\n\n      \u003ctable style=\"width:100%;border-collapse:collapse;margin-bottom:12px\"\u003e\n\n        \u003ctr\u003e\u003ctd style=\"padding:6px;color:#6a6e73;font-size:13px\"\u003eApp Status\u003c/td\u003e\n\n            \u003ctd style=\"padding:6px;color:#3e8635;font-weight:700\"\u003e\u0026#10003; {app_status}\u003c/td\u003e\u003c/tr\u003e\n\n        \u003ctr\u003e\u003ctd style=\"padding:6px;color:#6a6e73;font-size:13px\"\u003eArgoCD\u003c/td\u003e\n\n            \u003ctd style=\"padding:6px;color:#3e8635;font-weight:700\"\u003e\u0026#10003; Synced + Healthy\u003c/td\u003e\u003c/tr\u003e\n\n        \u003ctr\u003e\u003ctd style=\"padding:6px;color:#6a6e73;font-size:13px\"\u003eApp URL\u003c/td\u003e\n\n            \u003ctd style=\"padding:6px;font-size:13px\"\u003e\u003ca href=\"{app_url}\"\u003e{app_url}\u003c/a\u003e\u003c/td\u003e\u003c/tr\u003e\n\n      \u003c/table\u003e\n\n      \u003ca href=\"{app_url}\" style=\"display:inline-block;background:#3e8635;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none;font-weight:600;margin-right:8px\"\u003e\u0026#127760; Open Application\u003c/a\u003e\n\n      \u003ca href=\"{console_url}\" style=\"display:inline-block;background:#0066cc;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none;font-weight:600\"\u003e\u0026#128269; View Pipeline\u003c/a\u003e\n\n    \u003c/div\u003e'''\n\nelse:\n\n    bar = '#c9190b'\n\n    flag = f'\u0026#128680; PIPELINE BLOCKED — {issues_count} Security Issue(s) Detected'\n\n    subject = f'[BLOCKED] {pipelinerun} | {issues_count} Security Issue(s) | Linsoft DevSecOps'\n\n    fn = failed_stage[0] if failed_stage else 'Unknown'\n\n    done = ', '.join(n for n, s in stages if s == 'Succeeded') or 'None'\n\n    left = ', '.join(n for n, s in stages if s not in ['Succeeded', 'Failed']) or 'None'\n\n    main_box = f'''\n\n    \u003cdiv style=\"background:#fff5f5;border:1px solid #c9190b;border-radius:6px;padding:16px;margin:20px 0\"\u003e\n\n      \u003cp style=\"color:#c9190b;font-weight:700;margin:0 0 8px\"\u003e\u0026#128204; Pipeline blocked at: {fn}\u003c/p\u003e\n\n      \u003cp style=\"font-size:13px;color:#3c3c3c;margin:0 0 10px\"\u003e\n\n        \u003cb\u003eCompleted:\u003c/b\u003e {done}\u003cbr\u003e\n\n        \u003cb\u003ePending:\u003c/b\u003e {left}\n\n      \u003c/p\u003e\n\n      \u003ca href=\"{console_url}\" style=\"display:inline-block;background:#c9190b;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none;font-weight:600\"\u003e\u0026#128269; View Pipeline Logs\u003c/a\u003e\n\n    \u003c/div\u003e'''\n\n\n\nhtml = f'''\u003c!DOCTYPE html\u003e\u003chtml\u003e\u003chead\u003e\u003cmeta charset=\"UTF-8\"\u003e\u003c/head\u003e\n\n\u003cbody style=\"margin:0;padding:0;background:#f0f0f0;font-family:Arial,sans-serif\"\u003e\n\n\u003cdiv style=\"max-width:700px;margin:24px auto;background:#fff;border-radius:8px;overflow:hidden;border:1px solid #d2d2d2\"\u003e\n\n  \u003cdiv style=\"background:#0066cc;padding:20px 28px\"\u003e\n\n    \u003cp style=\"color:#fff;font-size:18px;font-weight:700;margin:0\"\u003e\u0026#9881; OpenShift OKD - Pipeline Security Report\u003c/p\u003e\n\n    \u003cp style=\"color:#b3d4ff;font-size:12px;margin:4px 0 0\"\u003eLinsoft DevSecOps Platform \u0026bull; {timestamp}\u003c/p\u003e\n\n  \u003c/div\u003e\n\n  \u003cdiv style=\"background:{bar};padding:10px 28px\"\u003e\n\n    \u003cspan style=\"color:#fff;font-size:13px;font-weight:600\"\u003e{flag}\u003c/span\u003e\n\n  \u003c/div\u003e\n\n  \u003cdiv style=\"padding:24px 28px\"\u003e\n\n    \u003cp style=\"font-size:18px;font-weight:700;color:#151515;margin:0 0 4px\"\u003e{pipelinerun}\u003c/p\u003e\n\n    \u003cp style=\"font-size:14px;color:#6a6e73;margin:0 0 20px\"\u003ePipeline execution security report\u003c/p\u003e\n\n    \u003cp style=\"font-size:12px;font-weight:700;color:#6a6e73;text-transform:uppercase;margin:0 0 8px\"\u003eStage Results\u003c/p\u003e\n\n    \u003ctable style=\"width:100%;border-collapse:collapse;margin-bottom:20px\"\u003e\n\n      \u003ctr style=\"background:#f5f5f5\"\u003e\n\n        \u003cth style=\"padding:8px 12px;text-align:left;font-size:12px;color:#6a6e73\"\u003eStage\u003c/th\u003e\n\n        \u003cth style=\"padding:8px 12px;text-align:left;font-size:12px;color:#6a6e73\"\u003eStatus\u003c/th\u003e\n\n      \u003c/tr\u003e\n\n      {stages_rows}\n\n    \u003c/table\u003e\n\n    {main_box}\n\n    {findings_summary}\n\n  \u003c/div\u003e\n\n  \u003cdiv style=\"background:#f5f5f5;padding:14px 28px;border-top:1px solid #e0e0e0\"\u003e\n\n    \u003cp style=\"font-size:11px;color:#6a6e73;margin:0\"\u003e\n\n      Linsoft DevSecOps \u0026bull; OpenShift OKD 4.20 SNO \u0026bull; Detection \u0026 Recommendation Model\n\n    \u003c/p\u003e\n\n  \u003c/div\u003e\n\n\u003c/div\u003e\n\n\u003c/body\u003e\u003c/html\u003e'''\n\n\n\n# ── SEND EMAIL ────────────────────────────────────────────────────────────────\n\nmsg = MIMEMultipart('mixed')\n\nmsg['Subject'] = subject\n\nmsg['From'] = 'yefa.attia@esprit.tn'\n\nmsg['To'] = 'yefa.attia@esprit.tn'\n\n\n\nmsg_body = MIMEMultipart('alternative')\n\nmsg_body.attach(MIMEText(html, 'html'))\n\nmsg.attach(msg_body)\n\n\n\n# Attach PDF report\n\nif detection_failed and pdf_generated:\n\n    try:\n\n        with open(pdf_path, 'rb') as f:\n\n            pdf_data = f.read()\n\n        attachment = MIMEBase('application', 'pdf')\n\n        attachment.set_payload(pdf_data)\n\n        encoders.encode_base64(attachment)\n\n        attachment.add_header('Content-Disposition', 'attachment',\n\n                             filename=f'security-report-{pipelinerun}.pdf')\n\n        msg.attach(attachment)\n\n        print('PDF attached to email')\n\n    except Exception as e:\n\n        print(f'Could not attach PDF: {e}')\n\n\n\ntry:\n\n    s = smtplib.SMTP('smtp.gmail.com', 587)\n\n    s.ehlo()\n\n    s.starttls()\n\n    s.login('yefa.attia@esprit.tn', 'xgtk sims dpby ulua')\n\n    s.sendmail('yefa.attia@esprit.tn', 'yefa.attia@esprit.tn', msg.as_string())\n\n    s.quit()\n\n    print('Email sent with PDF security report!')\n\nexcept Exception as e:\n\n    print(f'Email error: {e}')\n\n"}]},"workspaces":[{"name":"source","workspace":"source"}]}],"params":[{"default":"https://github.com/20eva/pfe-linsoft.git","name":"git-url","type":"string"},{"default":"sample-app","name":"git-revision","type":"string"},{"default":"http://sonarqube-sonarqube.sonarqube.svc.cluster.local:9000","name":"sonar-url","type":"string"},{"default":"sqa_b049ec82c7dec33a66637f4c0ae3d02770baa4da","name":"sonar-token","type":"string"},{"default":"image-registry.openshift-image-registry.svc.cluster.local:5000/blog-app/blog-api","name":"image-url","type":"string"}],"tasks":[{"name":"clone","params":[{"name":"git-url","value":"$(params.git-url)"},{"name":"git-revision","value":"$(params.git-revision)"}],"taskSpec":{"metadata":{},"spec":null,"steps":[{"args":["set -e\nrm -rf /workspace/source/app 2\u003e/dev/null || true\ngit clone --branch sample-app --depth 1 https://20eva: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@github.com/20eva/pfe-linsoft.git /workspace/source/app\nec
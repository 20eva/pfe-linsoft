apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-api
  namespace: blog-app
  labels:
    app: blog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-api
  template:
    metadata:
      labels:
        app: blog-api
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: blog-api
        image: ghcr.io/20eva/blog-api@sha256:6e0c421fb3b83b206bc0c32a85b323d38194b8c95a35325831f2964c1290bc44
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: HOST
          value: "0.0.0.0"

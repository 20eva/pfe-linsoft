
---

- name: Install httpd

  ansible.builtin.dnf:

    name: httpd

    state: present



- name: Configure httpd to listen on port 8080

  ansible.builtin.lineinfile:

    path: /etc/httpd/conf/httpd.conf

    regexp: '^Listen '

    line: 'Listen 8080'

  notify: restart httpd



- name: Allow port 8080 in SELinux

  ansible.builtin.command: semanage port -a -t http_port_t -p tcp 8080

  ignore_errors: true



- name: Open port 8080 in firewall

  ansible.posix.firewalld:

    port: 8080/tcp

    permanent: true

    state: enabled

    immediate: true

  ignore_errors: true



- name: Enable and start httpd

  ansible.builtin.systemd:

    name: httpd

    state: started

    enabled: true



- name: Create ignition directory

  ansible.builtin.file:

    path: /var/www/html/ignition

    state: directory

    mode: '0755'

    owner: apache

    group: apache



- name: Set SELinux context

  ansible.builtin.command: restorecon -Rv /var/www/html

  changed_when: false



- name: Create test file

  ansible.builtin.copy:

    content: "OKD Bastion HTTP Server - Ready\n"

    dest: /var/www/html/test.txt

    mode: '0644'



- name: Test HTTP server

  ansible.builtin.uri:

    url: "http://{{ bastion_ip }}:8080/test.txt"

    return_content: true

  register: http_test

  delegate_to: localhost



- name: Display HTTP test result

  ansible.builtin.debug:

    msg: "HTTP Server: {{ 'OK' if 'Ready' in http_test.content else 'FAILED' }}"


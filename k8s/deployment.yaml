
apiVersion: apps/v1

kind: Deployment

metadata:

  name: blog-api

  namespace: blog-app

  labels:

    app: blog-api

spec:

  replicas: 1

  selector:

    matchLabels:

      app: blog-api

  template:

    metadata:

      labels:

        app: blog-api

    spec:

      containers:

      - name: blog-api

        image: image-registry.openshift-image-registry.svc.cluster.local:5000/blog-app/blog-api:latest

        ports:

        - containerPort: 3000

        env:

        - name: PORT

          value: "3000"

        - name: HOST

          value: "0.0.0.0"


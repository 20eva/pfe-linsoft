---
- name: Display VM creation banner
  hosts: host
  gather_facts: false
  vars_files:
    - vars/main.yml
  tasks:
    - name: Show banner
      debug:
        msg: |
          ================================
          Creating OKD VMs
          ================================
          Bastion:   {{ bastion_ip }} ({{ bastion_mac }})
          Bootstrap: {{ bootstrap_ip }} ({{ bootstrap_mac }})
          OKD Node:  {{ okd_node_ip }} ({{ okd_node_mac }})
          ================================
- name: Create OKD Virtual Machines
  hosts: host
  become: false        # ← CHANGE THIS LINE
  gather_facts: yes
  vars_files:
    - vars/main.yml
  roles:
    - create-bastion
    - create-bootstrap
    - create-okd-node

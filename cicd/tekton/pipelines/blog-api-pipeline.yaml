apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: blog-api-pipeline
  namespace: blog-app
spec:
  params:
  - name: git-url
    type: string
    default: https://github.com/20eva/pfe-linsoft.git
  - name: git-revision
    type: string
    default: sample-app
  - name: sonar-url
    type: string
    default: http://sonarqube-sonarqube-sonarqube.apps.sno.okd.local
  - name: sonar-token
    type: string
    default: sqa_d51f6965f6610488cb7bc6ec7d3e627ef40fb593
  - name: image-url
    type: string
    default: image-registry.openshift-image-registry.svc:5000/blog-app/blog-api
  tasks:
  - name: clone
    taskSpec:
      steps:
      - name: clone
        image: alpine/git
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          rm -rf /workspace/source/app 2>/dev/null || true
          git clone --branch sample-app --depth 1 https://20eva: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@github.com/20eva/pfe-linsoft.git /workspace/source/app
          echo Clone_SUCCESS
      workspaces:
      - name: output
        mountPath: /workspace/source
    params:
    - name: git-url
      value: $(params.git-url)
    - name: git-revision
      value: $(params.git-revision)
    workspaces:
    - name: output
      workspace: source
  - name: build
    runAfter: [clone]
    taskSpec:
      steps:
      - name: npm-build
        image: node:18-alpine
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          cd /workspace/source/app
          npm install --legacy-peer-deps
          ./node_modules/.bin/nx build api --configuration=production
          echo BUILD_SUCCESS
      workspaces:
      - name: source
        mountPath: /workspace/source
    workspaces:
    - name: source
      workspace: source
  - name: sonarqube-scan
    runAfter: [build]
    taskSpec:
      steps:
      - name: scan
        image: sonarsource/sonar-scanner-cli:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          sonar-scanner \
            -Dsonar.projectKey=nodejs-blog-api \
            -Dsonar.sources=/workspace/source/app/src \
            -Dsonar.host.url=$(params.sonar-url) \
            -Dsonar.token=$(params.sonar-token) \
            -Dsonar.projectBaseDir=/workspace/source/app \
            -Dsonar.working.directory=/tmp/.scannerwork
      workspaces:
      - name: source
        mountPath: /workspace/source
    params:
    - name: sonar-url
      value: $(params.sonar-url)
    - name: sonar-token
      value: $(params.sonar-token)
    workspaces:
    - name: source
      workspace: source
  - name: quality-gate
    runAfter: [sonarqube-scan]
    taskRef:
      name: quality-gate-check
    params:
    - name: sonar-url
      value: $(params.sonar-url)
    - name: sonar-token
      value: $(params.sonar-token)
    - name: project-key
      value: nodejs-blog-api
  - name: docker-build
    runAfter: [quality-gate]
    taskSpec:
      steps:
      - name: build-push
        image: quay.io/buildah/stable:latest
        securityContext:
          privileged: true
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          cd /workspace/source/app
          buildah build --tls-verify=false -t $(params.image-url):latest .
          buildah push --tls-verify=false $(params.image-url):latest
          echo DOCKER_BUILD_SUCCESS
      workspaces:
      - name: source
        mountPath: /workspace/source
    params:
    - name: image-url
      value: $(params.image-url)
    workspaces:
    - name: source
      workspace: source
  - name: trivy-scan
    runAfter: [docker-build]
    taskSpec:
      steps:
      - name: scan
        image: aquasec/trivy:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          trivy image \
            --insecure \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --format table \
            $(params.image-url):latest
          echo TRIVY_SCAN_COMPLETE
    params:
    - name: image-url
      value: $(params.image-url)
  - name: cosign-sign
    runAfter: [trivy-scan]
    taskSpec:
      steps:
      - name: sign
        image: bitnami/cosign:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          COSIGN_PASSWORD=userOcp123 cosign sign \
            --key /etc/cosign/cosign.key \
            --allow-insecure-registry \
            $(params.image-url):latest
          echo IMAGE_SIGNED_SUCCESS
        volumeMounts:
        - name: cosign-key
          mountPath: /etc/cosign
      volumes:
      - name: cosign-key
        secret:
          secretName: cosign-key-secret
    params:
    - name: image-url
      value: $(params.image-url)
  workspaces:
  - name: source

---
- name: Check if Bastion VM already exists
  command: virsh list --all --name
  register: existing_vms
  changed_when: false

- name: Set fact for VM existence
  set_fact:
    bastion_exists: "{{ 'bastion' in existing_vms.stdout_lines }}"

- name: Display VM status
  debug:
    msg: "Bastion VM {{ 'already exists' if bastion_exists else 'will be created' }}"

- name: Copy base cloud image to bastion disk path
  command: cp {{ bastion_base_image }} {{ libvirt_images_path }}/bastion.qcow2
  args:
    creates: "{{ libvirt_images_path }}/bastion.qcow2"
  when: not bastion_exists

- name: Set ownership on bastion disk
  file:
    path: "{{ libvirt_images_path }}/bastion.qcow2"
    owner: qemu
    group: qemu
    mode: '0644'
  when: not bastion_exists

- name: Resize bastion disk to 20G
  command: "qemu-img resize {{ libvirt_images_path }}/bastion.qcow2 20G"
  when: not bastion_exists

- name: Create Bastion VM
  command: >
    virt-install
    --name bastion
    --ram {{ bastion_ram }}
    --vcpus {{ bastion_vcpus }}
    --disk path={{ libvirt_images_path }}/bastion.qcow2,format=qcow2,bus=virtio
    --network network={{ okd_network }},mac={{ bastion_mac }}
    --os-variant centos-stream9
    --graphics vnc,listen=0.0.0.0
    --import
    --noautoconsole
  when: not bastion_exists
  register: vm_creation

- name: Wait for VM to be defined
  command: virsh list --all --name
  register: vm_list
  until: "'bastion' in vm_list.stdout"
  retries: 5
  delay: 2
  changed_when: false
  when: not bastion_exists

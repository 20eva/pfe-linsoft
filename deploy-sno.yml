---
- name: Configure bastion services
  hosts: bastion
  become: true
  gather_facts: true
  vars_files:
    - vars/main.yml
  roles:
    - configure-bastion

- name: Prepare SNO embedded ISO
  hosts: host
  become: true
  gather_facts: true
  vars_files:
    - vars/main.yml
  roles:
    - embed-iso

- name: Boot okd-node
  hosts: host
  become: true
  gather_facts: false
  vars_files:
    - vars/main.yml
  roles:
    - boot-okd-node

- name: Monitor SNO installation
  hosts: host
  become: false
  gather_facts: true
  vars_files:
    - vars/main.yml
  roles:
    - monitor-sno

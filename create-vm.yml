---
- name: Display VM creation banner
  hosts: host
  gather_facts: false
  vars_files:
    - vars/main.yml
  tasks:
    - name: Show banner
      debug:
        msg: |
          ================================
          Creating OKD VMs
          ================================
          Bastion:   {{ bastion_ip }} ({{ bastion_mac }})
          Bootstrap: {{ bootstrap_ip }} ({{ bootstrap_mac }})
          OKD Node:  {{ okd_node_ip }} ({{ okd_node_mac }})
          ================================

- name: Create OKD Virtual Machines
  hosts: host
  become: false
  gather_facts: yes
  vars_files:
    - vars/main.yml
  roles:
    - create-bastion

- name: Configure Bastion VM
  hosts: bastion
  become: true
  gather_facts: yes
  vars_files:
    - vars/main.yml
  roles:
    - configure-bastion

- name: Download OKD Tools on Host
  hosts: host
  become: true
  gather_facts: yes
  vars_files:
    - vars/main.yml
  roles:
    - download-okd-tools

- name: Generate Ignition Files
  hosts: host
  become: false
  gather_facts: yes
  vars_files:
    - vars/main.yml
  roles:
    - generate-ignition

- name: Create Bootstrap and OKD Node VMs
  hosts: host
  become: false
  gather_facts: yes
  vars_files:
    - vars/main.yml
  roles:
    - create-bootstrap
    - create-okd-node

apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-api
  namespace: blog-app
  labels:
    app: blog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-api
  template:
    metadata:
      labels:
        app: blog-api
    spec:
      containers:
      - name: blog-api
        image: node:18-alpine
        command: ["/bin/sh", "-c", "echo 'Blog API placeholder' && sleep infinity"]
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"

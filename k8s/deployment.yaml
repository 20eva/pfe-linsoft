apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-api
  namespace: blog-app
  labels:
    app: blog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-api
  template:
    metadata:
      labels:
        app: blog-api
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: blog-api
        image: ghcr.io/20eva/blog-api@sha256:84ffe2406a7701bca6ac13cdda1a7ad7b70d4fd47a3dbe166f79dca42b0a8662
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: HOST
          value: "0.0.0.0"

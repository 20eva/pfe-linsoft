---
- name: Create OKD install directory
  file:
    path: "{{ install_dir }}"
    state: directory
    mode: '0755'

- name: Generate SSH key if not exists
  command: "ssh-keygen -t ed25519 -N '' -f {{ ansible_env.HOME }}/.ssh/id_ed25519"
  args:
    creates: "{{ ansible_env.HOME }}/.ssh/id_ed25519"

- name: Read SSH public key
  slurp:
    src: "{{ ansible_env.HOME }}/.ssh/id_ed25519.pub"
  register: ssh_pub_key

- name: Create install-config.yaml
  template:
    src: install-config.yaml.j2
    dest: "{{ install_dir }}/install-config.yaml"
    mode: '0644'

- name: Generate ignition configs (UPI)
  command: "{{ openshift_install_bin }} create ignition-configs --dir={{ install_dir }}"
  args:
    creates: "{{ install_dir }}/bootstrap.ign"
  register: ignition_result
  failed_when: ignition_result.rc != 0

- name: Copy bootstrap ignition to isos dir
  copy:
    src: "{{ install_dir }}/bootstrap.ign"
    dest: "{{ libvirt_isos_path }}/bootstrap.ign"
    remote_src: true
    mode: '0644'

- name: Copy master ignition to isos dir
  copy:
    src: "{{ install_dir }}/master.ign"
    dest: "{{ libvirt_isos_path }}/master.ign"
    remote_src: true
    mode: '0644'

- name: Fetch bootstrap ignition from host
  fetch:
    src: "{{ install_dir }}/bootstrap.ign"
    dest: /tmp/ignition/
    flat: yes

- name: Fetch master ignition from host
  fetch:
    src: "{{ install_dir }}/master.ign"
    dest: /tmp/ignition/
    flat: yes

- name: Create ignition directory on Bastion httpd
  file:
    path: /var/www/html/ignition
    state: directory
    mode: '0755'
    owner: nobody
    group: nobody
  delegate_to: bastion-vm

- name: Copy bootstrap ignition to Bastion httpd
  copy:
    src: /tmp/ignition/bootstrap.ign
    dest: /var/www/html/ignition/bootstrap.ign
    mode: '0644'
    owner: nobody
    group: nobody
  delegate_to: bastion-vm

- name: Copy master ignition to Bastion httpd
  copy:
    src: /tmp/ignition/master.ign
    dest: /var/www/html/ignition/master.ign
    mode: '0644'
    owner: nobody
    group: nobody
  delegate_to: bastion-vm

- name: Display ignition URLs
  debug:
    msg:
      - "Bootstrap ignition: http://{{ bastion_ip }}:8080/ignition/bootstrap.ign"
      - "Master ignition: http://{{ bastion_ip }}:8080/ignition/master.ign"

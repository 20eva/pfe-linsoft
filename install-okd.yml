
---

- name: Download SCOS ISO

  hosts: localhost

  connection: local

  become: yes

  vars_files:

    - vars/main.yml

  tasks:

    - name: Create ISO directory

      file:

        path: "{{ iso_download_dir }}"

        state: directory

        mode: '0755'



    - name: Check if SCOS ISO exists

      stat:

        path: "{{ iso_download_dir }}/{{ scos_iso_name }}"

      register: scos_iso_stat



    - name: Download SCOS ISO

      get_url:

        url: "{{ scos_iso_url }}"

        dest: "{{ iso_download_dir }}/{{ scos_iso_name }}"

        mode: '0644'

        timeout: 3600

      when: not scos_iso_stat.stat.exists



    - name: Display ISO information

      debug:

        msg: "SCOS ISO: {{ scos_iso_name }}"



- name: Download OKD Tools

  hosts: localhost

  connection: local

  become: yes

  vars_files:

    - vars/main.yml

  tasks:

    - name: Create tools directory

      file:

        path: "{{ ansible_env.HOME }}/okd-tools"

        state: directory

        mode: '0755'



    - name: Download openshift-install

      get_url:

        url: "{{ okd_installer_url }}"

        dest: "{{ ansible_env.HOME }}/okd-tools/openshift-install.tar.gz"

        mode: '0644'



    - name: Download oc client

      get_url:

        url: "{{ okd_client_url }}"

        dest: "{{ ansible_env.HOME }}/okd-tools/oc-client.tar.gz"

        mode: '0644'



    - name: Extract openshift-install

      unarchive:

        src: "{{ ansible_env.HOME }}/okd-tools/openshift-install.tar.gz"

        dest: "{{ ansible_env.HOME }}/okd-tools/"

        remote_src: yes

        creates: "{{ ansible_env.HOME }}/okd-tools/openshift-install"



    - name: Extract oc client

      unarchive:

        src: "{{ ansible_env.HOME }}/okd-tools/oc-client.tar.gz"

        dest: "{{ ansible_env.HOME }}/okd-tools/"

        remote_src: yes

        creates: "{{ ansible_env.HOME }}/okd-tools/oc"



    - name: Move openshift-install to /usr/local/bin

      copy:

        src: "{{ ansible_env.HOME }}/okd-tools/openshift-install"

        dest: /usr/local/bin/openshift-install

        mode: '0755'

        remote_src: yes



    - name: Move oc to /usr/local/bin

      copy:

        src: "{{ ansible_env.HOME }}/okd-tools/oc"

        dest: /usr/local/bin/oc

        mode: '0755'

        remote_src: yes



    - name: Move kubectl to /usr/local/bin

      copy:

        src: "{{ ansible_env.HOME }}/okd-tools/kubectl"

        dest: /usr/local/bin/kubectl

        mode: '0755'

        remote_src: yes



- name: Generate Ignition Config

  hosts: localhost

  connection: local

  become: no

  vars_files:

    - vars/main.yml

  tasks:

    - name: Create OKD install directory

      file:

        path: "{{ ansible_env.HOME }}/okd-install/{{ okd_cluster_name }}"

        state: directory

        mode: '0755'



    - name: Generate SSH key if not exists

      command: "ssh-keygen -t ed25519 -N '' -f {{ ansible_env.HOME }}/.ssh/id_ed25519"

      args:

        creates: "{{ ansible_env.HOME }}/.ssh/id_ed25519"



    - name: Read SSH public key

      slurp:

        src: "{{ ansible_env.HOME }}/.ssh/id_ed25519.pub"

      register: ssh_pub_key



    - name: Create install-config.yaml

      copy:

        content: |

          apiVersion: v1

          baseDomain: {{ okd_base_domain }}

          metadata:

            name: {{ okd_cluster_name }}

          compute:

            - name: worker

              replicas: 0

          controlPlane:

            name: master

            replicas: 1

            architecture: amd64

          networking:

            clusterNetwork:

              - cidr: 10.128.0.0/14

                hostPrefix: 23

            machineNetwork:

              - cidr: {{ network_cidr }}

            serviceNetwork:

              - 172.30.0.0/16

            networkType: OVNKubernetes

          platform:

            none: {}

          bootstrapInPlace:

            installationDisk: /dev/vda

          pullSecret: '{{ okd_pull_secret }}'

          sshKey: '{{ ssh_pub_key["content"] | b64decode }}'

        dest: "{{ ansible_env.HOME }}/okd-install/{{ okd_cluster_name }}/install-config.yaml"

        mode: '0644'



    - name: Generate Ignition config

      command: "openshift-install create single-node-ignition-config --dir={{ ansible_env.HOME }}/okd-install/{{ okd_cluster_name }}"

      register: ignition_result

      failed_when: ignition_result.rc != 0



    - name: Create ignition directory on Bastion

      file:

        path: /var/www/html/ignition

        state: directory

        mode: '0755'

        owner: apache

        group: apache

      delegate_to: bastion

      become: yes



    - name: Copy Ignition file to Bastion

      copy:

        src: "{{ ansible_env.HOME }}/okd-install/{{ okd_cluster_name }}/bootstrap-in-place-for-live-iso.ign"

        dest: /var/www/html/ignition/bootstrap.ign

        mode: '0644'

        owner: apache

        group: apache

      delegate_to: bastion

      become: yes



    - name: Display Ignition URL

      debug:

        msg: "✅ Ignition file available at: http://{{ bastion_ip }}/ignition/bootstrap.ign"



- name: Create OKD Node VM

  hosts: localhost

  connection: local

  become: yes

  vars_files:

    - vars/main.yml

  tasks:

    - name: Check if OKD VM already exists

      command: virsh list --all --name

      register: existing_vms

      changed_when: false



    - name: Create OKD Node disk image

      command: "qemu-img create -f qcow2 {{ libvirt_pool_path }}/okd-node.qcow2 {{ okd_node_disk }}G"

      args:

        creates: "{{ libvirt_pool_path }}/okd-node.qcow2"

      when: "'okd-node' not in existing_vms.stdout"



    - name: Create OKD Node VM

      command: "virt-install --name okd-node --ram {{ okd_node_ram }} --vcpus {{ okd_node_vcpus }} --disk path={{ libvirt_pool_path }}/okd-node.qcow2,format=qcow2,bus=virtio --network network={{ libvirt_network }},mac={{ okd_node_mac }} --graphics vnc,listen=0.0.0.0 --os-variant fedora-coreos-stable --cdrom {{ iso_download_dir }}/{{ scos_iso_name }} --noautoconsole --boot uefi"

      when: "'okd-node' not in existing_vms.stdout"

      register: vm_creation



    - name: Display next steps

      debug:

        msg: |

          ╔══════════════════════════════════════════════════════════════╗

          ║           OKD Node VM Created Successfully!                 ║

          ╚══════════════════════════════════════════════════════════════╝

          

          NEXT STEPS:

          

          1. Start the VM:

             sudo virsh start okd-node

          

          2. Connect to console:

             sudo virt-viewer okd-node

          

          3. At the boot prompt, press 'Tab' and add:

             coreos.inst.install_dev=/dev/vda 

             coreos.inst.ignition_url=http://{{ bastion_ip }}/ignition/bootstrap.ign

          

          4. Installation takes 20-40 minutes

          

          5. Monitor installation:

             export KUBECONFIG=~/okd-install/{{ okd_cluster_name }}/auth/kubeconfig

             openshift-install wait-for bootstrap-complete --dir=~/okd-install/{{ okd_cluster_name }}


apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-api
  namespace: blog-app
  labels:
    app: blog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-api
  template:
    metadata:
      labels:
        app: blog-api
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: blog-api
        image: ghcr.io/20eva/blog-api@sha256:1ae3aac26f20bd7ecba4e0f6dba296630b835dc545e4a7addd0e7d6e0ac9a3b4
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: HOST
          value: "0.0.0.0"

---
- name: Check if Bastion VM already exists
  command: virsh list --all --name
  register: existing_vms
  changed_when: false

- name: Set fact for VM existence
  set_fact:
    bastion_exists: "{{ 'bastion' in existing_vms.stdout_lines }}"

- name: Display VM status
  debug:
    msg: "Bastion VM {{ 'already exists' if bastion_exists else 'will be created' }}"

- name: Copy base cloud image to bastion disk path
  command: cp {{ bastion_base_image }} {{ libvirt_images_path }}/bastion.qcow2
  args:
    creates: "{{ libvirt_images_path }}/bastion.qcow2"
  when: not bastion_exists

- name: Resize bastion disk to 20G
  command: "qemu-img resize {{ libvirt_images_path }}/bastion.qcow2 20G"
  when: not bastion_exists

- name: Create Bastion VM
  command: >
    virt-install
    --name bastion
    --ram {{ bastion_ram }}
    --vcpus {{ bastion_vcpus }}
    --disk path={{ libvirt_images_path }}/bastion.qcow2,format=qcow2,bus=virtio
    --network network={{ okd_network }},mac={{ bastion_mac }}
    --os-variant centos-stream9
    --graphics vnc,listen=0.0.0.0
    --import
    --noautoconsole
  when: not bastion_exists

- name: Wait for VM to be defined
  command: virsh list --all --name
  register: vm_list
  until: "'bastion' in vm_list.stdout"
  retries: 5
  delay: 2
  changed_when: false
  when: not bastion_exists

- name: Wait for bastion VM to settle
  pause:
    seconds: 10
  when: not bastion_exists

- name: Stop bastion VM for key injection
  command: virsh shutdown bastion
  when: not bastion_exists
  ignore_errors: true

- name: Wait for VM to stop
  pause:
    seconds: 15
  when: not bastion_exists

- name: Inject SSH key into bastion disk
  shell: >
    virt-customize -a {{ libvirt_images_path }}/bastion.qcow2
    --run-command 'useradd -m -s /bin/bash admin || true'
    --run-command 'mkdir -p /root/.ssh /home/admin/.ssh'
    --run-command 'echo ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIyZlttfNwJjvfjK6mJ5pxbj0zZYfQCD3TsycOMuy6ul > /root/.ssh/authorized_keys'
    --run-command 'cp /root/.ssh/authorized_keys /home/admin/.ssh/authorized_keys'
    --run-command 'chown -R admin:admin /home/admin/.ssh'
    --run-command 'chmod 700 /root/.ssh /home/admin/.ssh'
    --run-command 'chmod 600 /root/.ssh/authorized_keys /home/admin/.ssh/authorized_keys'
    --run-command 'echo admin ALL=\(ALL\) NOPASSWD:ALL > /etc/sudoers.d/admin'
  when: not bastion_exists

- name: Start bastion VM after key injection
  command: virsh start bastion
  when: not bastion_exists

- name: Wait for bastion SSH to be ready
  wait_for:
    host: "{{ bastion_ip }}"
    port: 22
    timeout: 120
    delay: 15
  when: not bastion_exists

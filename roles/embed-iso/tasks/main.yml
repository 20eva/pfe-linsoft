---
- name: Verify SCOS base ISO exists
  ansible.builtin.stat:
    path: "{{ scos_iso_path }}"
  register: scos_stat
  failed_when: not scos_stat.stat.exists

- name: Verify ignition file exists
  ansible.builtin.stat:
    path: "{{ ignition_file }}"
  register: ign_stat
  failed_when: not ign_stat.stat.exists

- name: Show ignition file size
  ansible.builtin.debug:
    msg: "Ignition file: {{ ignition_file }} ({{ ign_stat.stat.size }} bytes)"

- name: Remove old embedded ISO if exists
  ansible.builtin.file:
    path: "{{ sno_embedded_iso }}"
    state: absent

- name: Build embedded ISO with install kernel args (no ignition embed - use ignition_url instead)
  ansible.builtin.command:
    cmd: >
      coreos-installer iso kargs modify
      --append "coreos.inst.install_dev=/dev/vda enforcing=0
      coreos.inst.ignition_url=http://{{ bastion_ip }}:8080/master.ign"
      --output {{ sno_embedded_iso }}
      {{ scos_iso_path }}
  register: embed_result
  failed_when: embed_result.rc != 0

- name: Verify kernel args in embedded ISO
  ansible.builtin.command:
    cmd: coreos-installer iso kargs show {{ sno_embedded_iso }}
  register: kargs_result
  changed_when: false

- name: Show kernel args
  ansible.builtin.debug:
    msg: "ISO kargs: {{ kargs_result.stdout }}"

- name: Fetch full ignition config from bootstrap MCS
  ansible.builtin.uri:
    url: "https://api-int.{{ okd_cluster_name }}.{{ okd_domain }}:22623/config/master"
    method: GET
    headers:
      Accept: "application/vnd.coreos.ignition+json;version=3.5.0, */*;q=0.1"
    validate_certs: false
    return_content: true
  register: full_ignition


- name: Strip passwd/user-create section to avoid useradd race condition
  ansible.builtin.set_fact:
    ignition_no_passwd: "{{ full_ignition.content | from_json | combine({'passwd': omit}) | to_json }}"
  ignore_errors: true

- name: Write modified ignition to bastion web root
  ansible.builtin.copy:
    content: "{{ full_ignition.content }}"
    dest: /var/www/html/master.ign
    mode: '0644'
  delegate_to: bastion-vm
  become: true

- name: Set ownership on embedded ISO
  ansible.builtin.file:
    path: "{{ sno_embedded_iso }}"
    owner: qemu
    group: qemu
    mode: '0644'

- name: Verify embedded ISO created
  ansible.builtin.stat:
    path: "{{ sno_embedded_iso }}"
  register: embedded_stat
  failed_when: not embedded_stat.stat.exists

- name: Show embed result
  ansible.builtin.debug:
    msg: "Embedded ISO ready: {{ sno_embedded_iso }} ({{ (embedded_stat.stat.size / 1024 / 1024) | round(0) }} MB)"

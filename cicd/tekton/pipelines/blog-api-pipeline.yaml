          error: {e}')\n\n\n\n# Poll for approval (max 1 hour)\n\nprint('Waiting for
          approval...')\n\ntimeout = 3600\n\ninterval = 30\n\nelapsed = 0\n\n\n\nwhile
          elapsed < timeout:\n\n    try:\n\n        req = urllib.request.urlopen(status_url,
          timeout=5)\n\n        result = json.loads(req.read().decode())\n\n        action
          = result.get('action', 'pending')\n\n        \n\n        if action == 'approve':\n\n
          \           print('APPROVED - proceeding to deployment')\n\n            exit(0)\n\n
          \       elif action == 'reject':\n\n            print('REJECTED - deployment
          cancelled')\n\n            exit(1)\n\n        else:\n\n            print(f'Still
          waiting... ({elapsed}s elapsed)')\n\n    except Exception as e:\n\n        print(f'Polling
          error: {e}')\n\n    \n\n    time.sleep(interval)\n\n    elapsed += interval\n\n\n\nprint('TIMEOUT
          - no approval received')\n\nexit(1)\n\n"

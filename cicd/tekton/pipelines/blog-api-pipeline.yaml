apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: blog-api-pipeline
  namespace: blog-app
spec:
  params:
  - name: git-url
    type: string
    default: https://github.com/20eva/pfe-linsoft.git
  - name: git-revision
    type: string
    default: sample-app
  - name: sonar-url
    type: string
    default: http://sonarqube-sonarqube-sonarqube.apps.sno.okd.local
  - name: sonar-token
    type: string
    default: sqa_d51f6965f6610488cb7bc6ec7d3e627ef40fb593
  tasks:
  - name: clone
    taskSpec:
      steps:
      - name: clone
        image: alpine/git
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          rm -rf /workspace/source/app 2>/dev/null || true
          git clone --branch sample-app --depth 1 https://20eva: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@github.com/20eva/pfe-linsoft.git /workspace/source/app
          echo Clone_SUCCESS
          ls /workspace/source/app/
      workspaces:
      - name: output
        mountPath: /workspace/source
    params:
    - name: git-url
      value: $(params.git-url)
    - name: git-revision
      value: $(params.git-revision)
    workspaces:
    - name: output
      workspace: source
  - name: build
    runAfter: [clone]
    taskSpec:
      steps:
      - name: npm-build
        image: node:18-alpine
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          cd /workspace/source/app
          npm install --legacy-peer-deps
          ./node_modules/.bin/nx build api --configuration=production
          echo BUILD_SUCCESS
          ls /workspace/source/app/dist/api/
      workspaces:
      - name: source
        mountPath: /workspace/source
    workspaces:
    - name: source
      workspace: source
  - name: sonarqube-scan
    runAfter: [build]
    taskSpec:
      steps:
      - name: scan
        image: sonarsource/sonar-scanner-cli:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          sonar-scanner \
            -Dsonar.projectKey=nodejs-blog-api \
            -Dsonar.sources=/workspace/source/app/src \
            -Dsonar.host.url=$(params.sonar-url) \
            -Dsonar.token=$(params.sonar-token) \
            -Dsonar.projectBaseDir=/workspace/source/app \
            -Dsonar.working.directory=/tmp/.scannerwork
      workspaces:
      - name: source
        mountPath: /workspace/source
    params:
    - name: sonar-url
      value: $(params.sonar-url)
    - name: sonar-token
      value: $(params.sonar-token)
    workspaces:
    - name: source
      workspace: source
  - name: quality-gate
    runAfter: [sonarqube-scan]
    taskRef:
      name: quality-gate-check
    params:
    - name: sonar-url
      value: $(params.sonar-url)
    - name: sonar-token
      value: $(params.sonar-token)
    - name: project-key
      value: nodejs-blog-api
  workspaces:
  - name: source

---
- name: Add bastion as a DNS resolver in /etc/resolv.conf (non-disruptive)
  ansible.builtin.lineinfile:
    path: /etc/resolv.conf
    line: "nameserver {{ bastion_ip }}"
    insertbefore: BOF
    state: present
  become: true

- name: Wait for OKD API to respond (up to 90 minutes)
  ansible.builtin.uri:
    url: "https://api.{{ okd_cluster_name }}.{{ okd_domain }}:6443/version"
    validate_certs: false
    status_code: 200
  register: api_check
  until: api_check.status == 200
  retries: 180
  delay: 30

- name: API is up
  ansible.builtin.debug:
    msg: "OKD API is UP at https://api.{{ okd_cluster_name }}.{{ okd_domain }}:6443"

- name: Wait for install to complete
  ansible.builtin.command:
    cmd: >
      {{ okd_tools_dir }}/openshift-install
      wait-for install-complete
      --dir {{ okd_install_dir }}
      --log-level info
  environment:
    KUBECONFIG: "{{ okd_install_dir }}/auth/kubeconfig"

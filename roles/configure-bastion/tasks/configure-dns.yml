
---

- name: Install bind packages

  ansible.builtin.dnf:

    name:

      - bind

      - bind-utils

    state: present



- name: Deploy named.conf

  ansible.builtin.copy:

    dest: /etc/named.conf

    owner: named

    group: named

    mode: '0640'

    content: |

      options {

          listen-on port 53 { 127.0.0.1; {{ bastion_ip }}; };

          listen-on-v6 port 53 { ::1; };

          directory       "/var/named";

          allow-query     { localhost; 192.168.100.0/24; };

          recursion yes;

          forwarders { 8.8.8.8; };

          forward only;

          dnssec-validation no;

      };

      zone "{{ okd_domain }}" IN {

          type master;

          file "/var/named/zones/db.{{ okd_domain }}";

          allow-update { none; };

      };

      zone "100.168.192.in-addr.arpa" IN {

          type master;

          file "/var/named/zones/db.100.168.192";

          allow-update { none; };

      };

      include "/etc/named.rfc1912.zones";

      include "/etc/named.root.key";

  notify: restart named



- name: Create zones directory

  ansible.builtin.file:

    path: /var/named/zones

    state: directory

    owner: named

    group: named

    mode: '0750'



- name: Deploy forward zone

  ansible.builtin.copy:

    dest: "/var/named/zones/db.{{ okd_domain }}"

    owner: named

    group: named

    mode: '0640'

    content: |

      $TTL 3600

      @ IN SOA bastion.{{ okd_domain }}. admin.{{ okd_domain }}. (

              2026060201 3600 900 604800 86400 )

      @                   IN  NS      bastion.{{ okd_domain }}.

      bastion             IN  A       {{ bastion_ip }}

      api.{{ okd_cluster_name }}      IN  A  {{ okd_node_ip }}

      api-int.{{ okd_cluster_name }}  IN  A  {{ okd_node_ip }}

      *.apps.{{ okd_cluster_name }}   IN  A  {{ okd_node_ip }}

      okd-node            IN  A       {{ okd_node_ip }}

      okd-node.{{ okd_cluster_name }} IN  A  {{ okd_node_ip }}

  notify: restart named



- name: Deploy reverse zone

  ansible.builtin.copy:

    dest: /var/named/zones/db.100.168.192

    owner: named

    group: named

    mode: '0640'

    content: |

      $TTL 3600

      @ IN SOA bastion.{{ okd_domain }}. admin.{{ okd_domain }}. (

              2026060201 3600 900 604800 86400 )

      @   IN  NS  bastion.{{ okd_domain }}.

      10  IN  PTR bastion.{{ okd_domain }}.

      50  IN  PTR okd-node.{{ okd_cluster_name }}.{{ okd_domain }}.

  notify: restart named



- name: Enable and start named

  ansible.builtin.systemd:

    name: named

    enabled: true

    state: started



- name: Open DNS port in firewall

  ansible.posix.firewalld:

    service: dns

    permanent: true

    state: enabled

    immediate: true

  ignore_errors: true



- name: Flush handlers

  ansible.builtin.meta: flush_handlers



- name: Test DNS - API endpoint

  ansible.builtin.command:

    cmd: "dig @127.0.0.1 api.{{ okd_cluster_name }}.{{ okd_domain }} +short"

  register: dns_test

  changed_when: false

  failed_when: okd_node_ip not in dns_test.stdout



- name: Test DNS - Apps wildcard

  ansible.builtin.command:

    cmd: "dig @127.0.0.1 test.apps.{{ okd_cluster_name }}.{{ okd_domain }} +short"

  register: dns_test_apps

  changed_when: false

  failed_when: okd_node_ip not in dns_test_apps.stdout



- name: Show DNS results

  ansible.builtin.debug:

    msg:

      - "api.{{ okd_cluster_name }}.{{ okd_domain }} -> {{ dns_test.stdout }}"

      - "*.apps.{{ okd_cluster_name }}.{{ okd_domain }} -> {{ dns_test_apps.stdout }}"


---
- name: Check if OKD VM already exists
  command: virsh list --all --name
  register: existing_vms
  changed_when: false

- name: Set fact for VM existence
  set_fact:
    okd_node_exists: "{{ 'okd-node' in existing_vms.stdout_lines }}"

- name: Destroy existing VM if it exists
  command: virsh destroy okd-node
  when: okd_node_exists
  ignore_errors: yes

- name: Undefine existing VM if it exists
  command: virsh undefine okd-node --remove-all-storage
  when: okd_node_exists
  ignore_errors: yes

- name: Create OKD Node disk image
  command: "qemu-img create -f qcow2 {{ libvirt_images_path }}/okd-node.qcow2 {{ okd_node_disk }}"
  args:
    creates: "{{ libvirt_images_path }}/okd-node.qcow2"

- name: Create OKD Node VM
  command: >
    virt-install
    --name okd-node
    --ram {{ okd_node_ram }}
    --vcpus {{ okd_node_vcpus }}
    --disk path={{ libvirt_images_path }}/okd-node.qcow2,format=qcow2,bus=virtio
    --network network={{ okd_network }},mac={{ okd_node_mac }}
    --os-variant centos-stream10
    --graphics vnc,listen=0.0.0.0
    --noautoconsole
    --noreboot
    --cdrom {{ libvirt_isos_path }}/scos.x86_64.iso
    --qemu-commandline="-fw_cfg name=opt/com.coreos/config,file={{ libvirt_isos_path }}/master.ign"

- name: Wait for OKD Node VM to be defined
  command: virsh list --all --name
  register: vm_list
  until: "'okd-node' in vm_list.stdout"
  retries: 5
  delay: 2
  changed_when: false

- name: Start OKD Node VM
  command: virsh start okd-node

- name: Display OKD Node VM status
  debug:
    msg: "OKD Node VM started — SNO cluster installation in progress"

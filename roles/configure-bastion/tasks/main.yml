
---

- name: Wait for Bastion to be reachable via SSH

  wait_for:

    host: "{{ bastion_ip }}"

    port: 22

    delay: 5

    timeout: 300

  delegate_to: localhost



- name: Test SSH connectivity

  ping:



- name: Update all packages

  dnf:

    name: '*'

    state: latest

  tags: update



- name: Install base packages

  dnf:

    name:

      - dnsmasq

      - haproxy

      - httpd

      - firewalld

      - vim

      - wget

      - curl

      - bind-utils

      - tar

      - gzip

    state: present



- name: Enable and start firewalld

  systemd:

    name: firewalld

    state: started

    enabled: yes



- name: Configure firewall services

  firewalld:

    permanent: yes

    immediate: yes

    state: enabled

    service: "{{ item }}"

  loop:

    - dns

    - http

    - https



- name: Configure firewall - ports

  firewalld:

    permanent: yes

    immediate: yes

    state: enabled

    port: "{{ item }}"

  loop:

    - 6443/tcp

    - 22623/tcp



- name: Configure DNS

  include_tasks: configure-dns.yml



- name: Configure HAProxy

  include_tasks: configure-haproxy.yml



- name: Configure HTTP server

  include_tasks: configure-httpd.yml



- name: Display configuration summary

  debug:

    msg: |

      ╔═══════════════════════════════════════════════╗

      ║  Bastion Configuration Complete!              ║

      ╚═══════════════════════════════════════════════╝

      

      Services Running:

      ✓ DNS (dnsmasq)     - Port 53

      ✓ HAProxy           - Ports 80, 443, 6443, 22623

      ✓ HTTP Server       - Port 80

      

      Test DNS:

        dig @{{ bastion_ip }} api.{{ okd_domain }}

      

      Next: Create OKD node VM

